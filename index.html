<!doctype html>
<html lang="en" suppressHydrationWarning>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/src/assets/logo-white.png" />
    <link rel="apple-touch-icon" href="/src/assets/logo-white.png" />
    
    <!-- Preload LCP hero image for faster rendering -->
    <link rel="preload" as="image" href="/src/assets/hero-cafe.jpg" fetchpriority="high" />
    
    <!-- Security Meta -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-XSS-Protection" content="1; mode=block" />
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
    <meta http-equiv="Permissions-Policy" content="geolocation=(), microphone=(), camera=()" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https: blob:; connect-src 'self' https:;" />
    
    <title>RD CAFE | Cozy Premium Café Experience</title>
    <meta name="description" content="RD CAFE - A cozy haven where every cup tells a story. Experience warmth, comfort, and exceptional coffee in our premium urban café." />
    <meta name="author" content="RD CAFE" />
    <meta name="keywords" content="café, coffee, premium coffee, cozy café, espresso, latte, pastries, downtown café" />

    <meta property="og:title" content="RD CAFE | Cozy Premium Café Experience" />
    <meta property="og:description" content="A cozy haven where every cup tells a story. Experience warmth, comfort, and exceptional coffee." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-image.jpg" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@rdcafe" />
    <meta name="twitter:image" content="/og-image.jpg" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
